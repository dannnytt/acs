labels:
  app: nginx

replicaCount: 1

container:
  name: nginx-container

image:
  repository: nginx
  tag: latest

resources:
  limits:
    memory: "128Mi"
    cpu: "500m"

service:
  protocol: TCP
  type: ClusterIP
  port: 8000
  targetPort: 80

ingress:
  enabled: true
  host: nginx-chart.local

serviceAccount:
  create: true
  name: ""

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
